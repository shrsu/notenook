# Local dependencies for the AI assistant: vector store + a scratch database.
services:
  qdrant:
    image: qdrant/qdrant:v1.19.0
    ports:
      - "6333:6333"
    volumes:
      - ./qdrant_storage:/qdrant/storage

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - ./mongo_storage:/data/db

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
